apiVersion: batch/v1
kind: Job
metadata:
  name: memory-stress-test
  namespace: online-boutique
  labels:
    app: stress-test
    type: memory
spec:
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app: stress-test
        type: memory
    spec:
      restartPolicy: Never
      containers:
        - name: stress
          image: progrium/stress
          command: ["stress"]
          args:
            - "--vm"
            - "2"
            - "--vm-bytes"
            - "1G"
            - "--timeout"
            - "900s"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "3Gi"
