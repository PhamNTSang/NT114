apiVersion: v1
kind: Namespace
metadata:
  name: loadtest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile
  namespace: loadtest
data:
  locustfile.py: |
    import random
    from locust import HttpUser, between, task

    PRODUCTS = ["OLJCESPC7Z", "66VCHSJNUP", "1YMWWN1N4O", "L9ECAV7KIM", "2ZYFJ3GM2N",
                "0PUK6V6EV0", "LS4PSXUNUM", "9SIQT8TOJO", "6E92ZMYYFZ"]
    CURRENCIES = ["USD", "EUR", "JPY", "GBP", "CAD"]

    class OnlineBoutiqueUser(HttpUser):
        wait_time = between(1, 3)

        def on_start(self):
            
            self.client.headers.update({"Host": "shop.example.com"})

        @task(10)
        def index(self):
            self.client.get("/")

        @task(5)
        def product(self):
            self.client.get(f"/product/{random.choice(PRODUCTS)}", name="/product/[id]")

        @task(3)
        def add_to_cart(self):
            self.client.post("/cart", data={"product_id": random.choice(PRODUCTS),
                                            "quantity": random.randint(1, 3)})

        @task(2)
        def view_cart(self):
            self.client.get("/cart")

        @task(2)
        def set_currency(self):
            self.client.post("/setCurrency", data={"currency_code": random.choice(CURRENCIES)})

        @task(1)
        def checkout(self):
            self.client.post("/cart/checkout", data={
                "email": "test@example.com", "street_address": "123 Test St",
                "zip_code": "10001", "city": "New York", "state": "NY", "country": "US",
                "credit_card_number": "4111111111111111", "credit_card_expiration_month": "12",
                "credit_card_expiration_year": "2030", "credit_card_cvv": "123"})
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: loadtest
spec:
  replicas: 1
  selector: { matchLabels: { app: locust-master } }
  template:
    metadata: { labels: { app: locust-master } }
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.29.1  
          args: ["-f", "/mnt/locust/locustfile.py", "--master",
                 "-H", "http://ingress-nginx-controller.ingress-nginx.svc.cluster.local"]
          ports:
            - { containerPort: 8089, name: web }
            - { containerPort: 5557, name: comm }
          volumeMounts: [{ name: locustfile, mountPath: /mnt/locust }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: locustfile
          configMap: { name: locustfile }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: loadtest
spec:
  replicas: 2
  selector: { matchLabels: { app: locust-worker } }
  template:
    metadata: { labels: { app: locust-worker } }
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.29.1
          args: ["-f", "/mnt/locust/locustfile.py", "--worker", "--master-host", "locust-master"]
          volumeMounts: [{ name: locustfile, mountPath: /mnt/locust }]
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: locustfile
          configMap: { name: locustfile }
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: loadtest
spec:
  selector: { app: locust-master }
  ports:
    - { name: web, port: 8089, targetPort: 8089 }
    - { name: comm, port: 5557, targetPort: 5557 }