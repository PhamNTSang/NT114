services:
  master:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --master -H host.docker.internal:8080
    networks:
      - locust

  worker:
    image: locustio/locust
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --worker --master-host master
    depends_on:
      - master
    deploy:
      replicas: 4
    networks:
      - locust

networks:
  locust:
    driver: bridge
