apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PhamNTSang/NT114.git
    path: kubernetes/online-boutique
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique
  # ArgoCD khong duoc theo doi va bo qua su thay đoi o 2 trường du lieu cua cac Deployment
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.replicas
        - .spec.template.spec.containers[].resources
  syncPolicy:
    automated:
      prune: true
      selfHeal: false  
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true