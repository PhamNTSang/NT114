name: Self-healing - test and build image

on:
  push:
    branches: ["**"]
    paths: ["self-healing/**", ".github/workflows/selfheal.yaml"]
  workflow_dispatch: {}

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}

jobs:
  build-selfheal:
    name: Test and build self-healing image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Unit tests
        working-directory: self-healing
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m pytest -q
      - id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: self-healing
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DOCKERHUB_USER }}/selfheal:${{ steps.vars.outputs.short_sha }}
            ${{ env.DOCKERHUB_USER }}/selfheal:latest