alertmanager:
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: "https://hooks.slack.com/services/REPLACE/ME/PLEASE"

    route:
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: slack-notifications
      routes:
        - matchers:
            - severity = critical
          receiver: slack-critical
          group_wait: 10s
        - matchers:
            - severity = warning
          receiver: slack-notifications

    receivers:
      - name: slack-notifications
        slack_configs:
          - channel: "#monitoring-alerts"
            send_resolved: true
            title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
            text: |-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              *Namespace:* {{ .Labels.namespace }}
              {{ end }}

      - name: slack-critical
        slack_configs:
          - channel: "#monitoring-alerts"
            send_resolved: true
            title: "[CRITICAL] {{ .CommonLabels.alertname }}"
            text: |-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Details:*
              {{ range .Labels.SortedPairs }} - *{{ .Name }}:* {{ .Value }}
              {{ end }}
              {{ end }}

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal:
          - alertname
          - namespace
