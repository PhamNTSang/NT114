apiVersion: v1
kind: Namespace
metadata:
  name: selfheal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: selfheal-agent
  namespace: selfheal
---
# Cap quyen toi thieu trong namespace ung dung
apiVersion: rbac.authorization.k8s.io/v1
kind: Role 
metadata:
  name: selfheal-agent
  namespace: online-boutique
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: selfheal-agent
  namespace: online-boutique
subjects:
  - kind: ServiceAccount
    name: selfheal-agent
    namespace: selfheal
roleRef:
  kind: Role
  name: selfheal-agent
  apiGroup: rbac.authorization.k8s.io
---
# Cap quyen doc thong tin tai nguyen cum
# Chi cho phep doc node và pod toan cum de tinh CPU allocatable con trong
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: selfheal-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: selfheal-agent-readonly
subjects:
  - kind: ServiceAccount
    name: selfheal-agent
    namespace: selfheal
roleRef:
  kind: ClusterRole
  name: selfheal-agent-readonly
  apiGroup: rbac.authorization.k8s.io
---
# Cấp quyền đọc cấu hình hệ thống
# Chi cho phep doc kill switch trong namespace selfheal
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: selfheal-config-reader
  namespace: selfheal
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: selfheal-config-reader
  namespace: selfheal
subjects:
  - kind: ServiceAccount
    name: selfheal-agent
    namespace: selfheal
roleRef:
  kind: Role
  name: selfheal-config-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: selfheal-config
  namespace: selfheal
data:
  AGENT_ENABLED: "true"        
  SLO_P99_MS: "200"           
  SLO_ERR: "0.01"
  REQUIRE_APPROVAL: ""         
  LLM_BACKEND: "groq"         
  LLM_MODEL: "openai/gpt-oss-120b"
  LLM_FALLBACK_MODEL: "openai/gpt-oss-20b"   